<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charan Electricals – Digital Card</title>
<meta name="theme-color" content="#0f2a6b">
<meta name="description" content="Premium Electrical Solutions • Sales • Services — Bangalore">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1f52; --navy2:#13347f; --gold:#f5c518; --gold-soft:#e3c891;
    --ink:#10213f; --muted:#5b6785; --bg:#eef1f8; --card:#fff; --line:#e3e8f3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,var(--navy) 0,var(--navy2) 100%) fixed;
    color:var(--ink); min-height:100vh;
    padding:24px 16px calc(32px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  a{color:inherit;text-decoration:none}
  .card{width:100%;max-width:440px;background:var(--card);border-radius:28px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35);animation:rise .6s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .cover{position:relative;background:var(--navy);color:#fff;text-align:center;
    padding:34px 24px 74px;border-bottom:4px solid var(--gold)}
  .cover::before{content:"";position:absolute;inset:10px;border:1px solid rgba(245,197,24,.45);border-radius:20px;pointer-events:none}
  .blessing{font-size:11px;letter-spacing:2px;color:var(--gold-soft);text-transform:uppercase}
  .brand{font-family:"Playfair Display",Georgia,serif;font-size:30px;letter-spacing:2px;margin-top:12px;color:var(--gold)}
  .tag{font-size:11px;letter-spacing:2.2px;margin-top:6px;color:#dbe3ff;text-transform:uppercase}

  .photo{width:116px;height:116px;border-radius:50%;margin:-58px auto 0;position:relative;
    border:5px solid #fff;background:linear-gradient(135deg,var(--navy),var(--navy2));
    display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 24px rgba(11,31,82,.35)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo svg{width:56px;height:56px}

  .who{text-align:center;padding:14px 24px 4px}
  .who h1{font-size:26px;font-weight:700}
  .who .title{color:var(--muted);font-weight:500;margin-top:2px}
  .who .company{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;background:#fff8d6;color:#7a5d00;border:1px solid #f1dc82;border-radius:99px;padding:6px 14px}

  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px 20px 6px}
  .quick a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;
    background:var(--bg);font-size:12px;font-weight:600;transition:.2s;min-height:64px;justify-content:center}
  .quick a:active{transform:scale(.96)}
  .quick svg{width:22px;height:22px;stroke:var(--navy2)}

  .list{padding:14px 20px 4px}
  .row{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--navy);display:grid;place-items:center}
  .ico svg{width:19px;height:19px;stroke:var(--gold)}
  .row small{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .row span{font-weight:600;word-break:break-word}

  .services{padding:6px 24px 8px}
  .services h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips li{list-style:none;font-size:12.5px;font-weight:500;background:var(--bg);border-radius:99px;padding:7px 12px}

  .cta{padding:18px 20px 8px;display:grid;gap:10px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;border:0;border-radius:16px;
    padding:16px;font:700 16px "DM Sans",sans-serif;cursor:pointer;transition:.2s;
    line-height:1;text-align:center;
  }
  .btn:active{transform:scale(.98)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn-primary{background:var(--gold);color:#1b1500;box-shadow:0 8px 20px rgba(245,197,24,.4)}
  .btn-primary svg{stroke:#1b1500}
  .btn-ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
  .btn-ghost svg{stroke:var(--navy)}

  /* Share menu */
  .share-wrap{position:relative}
  .share-menu{
    display:none; position:absolute; bottom:110%; left:0; right:0; background:#fff;
    border-radius:18px; box-shadow:0 12px 30px rgba(11,31,82,.25);
    border:1px solid var(--line); overflow:hidden; z-index:20;
    animation:pop .15s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .share-menu.open{display:block}
  .share-menu a{
    display:flex; align-items:center; gap:12px; padding:14px 18px; font-weight:600;
    font-size:15px; border-bottom:1px solid var(--line); transition:.15s;
  }
  .share-menu a:last-child{border-bottom:0}
  .share-menu a:active{background:var(--bg)}
  .share-menu svg{width:20px;height:20px;flex:none}
  .share-menu .wa svg{stroke:#25D366}
  .share-menu .tg svg{stroke:#229ED9}
  .share-menu .cp svg{stroke:var(--navy2)}
  .share-menu .sys svg{stroke:var(--navy2)}

  footer{text-align:center;font-size:12px;color:var(--muted);padding:12px 20px 22px}
  footer b{color:var(--navy)}
  svg{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<main class="card">
  <div class="cover">
    <div class="blessing">॥ Sri Venkateswara Prasanna ॥</div>
    <div class="brand" id="brand">CHARAN ELECTRICALS</div>
    <div class="tag">Premium Electrical Solutions • Sales • Services</div>
  </div>

  <div class="photo" id="photo" aria-label="Profile photo">
    <!-- Set CONFIG.photo below to show a real photo; otherwise this logo shows -->
    <svg viewBox="0 0 24 24" stroke="#f5c518" fill="#f5c518" stroke-width="1"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
  </div>

  <section class="who">
    <h1 id="name"></h1>
    <p class="title" id="title"></p>
    <span class="company" id="company"></span>
  </section>

  <nav class="quick" aria-label="Quick actions">
    <a id="qCall" href="#"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Call</a>
    <a id="qWa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>WhatsApp</a>
    <a id="qMail" href="#"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</a>
  </nav>

  <section class="list">
    <a class="row" id="rPhone" href="#">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div>
      <div><small>Mobile</small><span id="phoneTxt"></span></div>
    </a>
    <a class="row" id="rMail" href="#">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
      <div><small>Email</small><span id="mailTxt"></span></div>
    </a>
    <a class="row" id="rMap" href="#" target="_blank" rel="noopener">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
      <div><small>Address</small><span id="addrTxt"></span></div>
    </a>
  </section>

  <section class="services">
    <h2>Services</h2>
    <ul class="chips" id="chips"></ul>
  </section>

  <div class="cta">
    <a class="btn btn-primary" id="visit" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
      Visit Website
    </a>
    <button class="btn btn-ghost" id="save" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
      Save Contact
    </button>
    <div class="share-wrap">
      <button class="btn btn-ghost" id="share" type="button">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        Share Card
      </button>
      <div class="share-menu" id="shareMenu" role="menu">
        <a class="wa" href="#" id="shareWa" target="_blank" rel="noopener" role="menuitem">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
          WhatsApp
        </a>
        <a class="tg" href="#" id="shareTg" target="_blank" rel="noopener" role="menuitem">
          <svg viewBox="0 0 24 24"><path d="M21 3 3 10.5l5.5 2L11 20l3-4.5 5.5 3L21 3z"/><path d="M8.5 12.5 21 3"/></svg>
          Telegram
        </a>
        <a class="cp" href="#" id="shareCopy" role="menuitem">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy Link
        </a>
        <a class="sys" href="#" id="shareSys" role="menuitem" hidden>
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
          More options…
        </a>
      </div>
    </div>
  </div>

  <footer><b>Quality Service</b> | <b>Trusted Expertise</b> | <b>24/7 Support</b></footer>
</main>

<script>
  /* ============================================================
     EDIT YOUR DETAILS HERE
     ============================================================ */
  const CONFIG = {
    name: "SURESH B",                       // ← your full name
    title: "Residential Electrical Contractor", // ← your job title
    company: "Charan Electricals",
    photo: "",                            // ← URL or data: URI of your photo (leave "" to show logo)
    phone: "+919036882185",
    phoneDisplay: "+91 90368 82185",
    whatsapp: "919036882185",             // country code + number, no "+"
    email: "contact@charanelectricals.com",
    address: "Mathikere, Yeshwantpur, Bangalore – 560022",
    website: "https://charanelectricals.github.io/CHARANELECTRICALS/", // ← PASTE YOUR NEW WEBSITE LINK HERE (replace this line)
    services: [
      "All Types of House & Commercial Wiring",
      "Switchboard & MCB Installation",
      "Light Fixtures & Decorative Lighting",
      "Maintenance Work",
      "Electrical Fault Finding"
    ]
  };
  /* ============================================================ */

  const $ = id => document.getElementById(id);
  document.title = CONFIG.name + " – " + CONFIG.company;
  $("name").textContent = CONFIG.name;
  $("title").textContent = CONFIG.title;
  $("company").textContent = CONFIG.company;
  $("phoneTxt").textContent = CONFIG.phoneDisplay;
  $("mailTxt").textContent = CONFIG.email;
  $("addrTxt").textContent = CONFIG.address;

  const tel = "tel:" + CONFIG.phone, mail = "mailto:" + CONFIG.email;
  $("qCall").href = $("rPhone").href = tel;
  $("qMail").href = $("rMail").href = mail;
  $("qWa").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent("Hi, I found your digital card and need an electrical service.");
  $("rMap").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.address);
  $("visit").href = CONFIG.website;

  CONFIG.services.forEach(s => {
    const li = document.createElement("li"); li.textContent = s; $("chips").appendChild(li);
  });

  if (CONFIG.photo) {
    const img = new Image(); img.alt = CONFIG.name;
    img.onload = () => { $("photo").innerHTML = ""; $("photo").appendChild(img); };
    img.src = CONFIG.photo;
  }

  /* ---------- SAVE CONTACT (vCard .vcf – reliable cross-platform) ---------- */
  $("save").addEventListener("click", () => {
    const vcf = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "FN:" + CONFIG.name,
      "ORG:" + CONFIG.company,
      "TITLE:" + CONFIG.title,
      "TEL;TYPE=CELL:" + CONFIG.phone,
      "EMAIL:" + CONFIG.email,
      "ADR;TYPE=WORK:;;" + CONFIG.address + ";;;;",
      "URL:" + CONFIG.website,
      "END:VCARD"
    ].join("\r\n");
    const blob = new Blob([vcf], {type: "text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = CONFIG.name.replace(/\s+/g, "_") + ".vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  /* ---------- SHARE MENU ---------- */
  const shareMenu = $("shareMenu");
  const shareBtn  = $("share");
  const pageUrl   = location.href;
  const shareText = CONFIG.name + " – " + CONFIG.company + " | Electrical Solutions, Bangalore";

  function buildShareLinks(){
    $("shareWa").href = "https://wa.me/?text=" + encodeURIComponent(shareText + " " + pageUrl);
    $("shareTg").href = "https://t.me/share/url?url=" + encodeURIComponent(pageUrl) + "&text=" + encodeURIComponent(shareText);
  }
  buildShareLinks();

  // Toggle menu
  shareBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    shareMenu.classList.toggle("open");
  });

  // Close menu on outside click / Escape
  document.addEventListener("click", (e) => {
    if (!shareMenu.contains(e.target) && e.target !== shareBtn && !shareBtn.contains(e.target)) {
      shareMenu.classList.remove("open");
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") shareMenu.classList.remove("open");
  });

  // Copy link
  $("shareCopy").addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      await navigator.clipboard.writeText(pageUrl);
      $("shareCopy").lastChild.textContent = " Copied!";
      setTimeout(() => { $("shareCopy").lastChild.textContent = " Copy Link"; }, 1500);
    } catch {
      prompt("Copy this link:", pageUrl);
    }
    shareMenu.classList.remove("open");
  });

  // Native system share (if available)
  if (navigator.share) {
    const sys = $("shareSys");
    sys.hidden = false;
    sys.addEventListener("click", (e) => {
      e.preventDefault();
      navigator.share({ title: CONFIG.company, text: shareText, url: pageUrl }).catch(() => {});
      shareMenu.classList.remove("open");
    });
  }
</script>
</body>
</html>
